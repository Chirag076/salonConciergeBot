name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t salon-concierge .
      - name: Smoke test the image
        run: docker run --rm -e GEMINI_API_KEY=dummy salon-concierge python -c "import booking, salon_bot; print(booking.list_services())"

  agent-evals:
    # Runs the real Gemini agent against 13 scenarios. Needs the GEMINI_API_KEY
    # repository secret; skipped on forks and PRs where secrets aren't available.
    needs: unit-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run agent evals
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret not set, skipping evals"
            exit 0
          fi
          python eval.py